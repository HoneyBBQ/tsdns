# .goreleaser.yaml
# Documentation at https://goreleaser.com

# Before release, make sure to tag: git tag -a v0.1.0 -m "Release v0.1.0"
# Then run: goreleaser release --clean

project_name: tsdns

before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    goarm:
      - "7"
    main: ./cmd/tsdns
    binary: tsdns
    ldflags:
      - -s -w -X 'github.com/honeybbq/tsdns/internal/cli.version={{.Version}}' -X 'github.com/honeybbq/tsdns/internal/cli.commit={{.Commit}}' -X 'github.com/honeybbq/tsdns/internal/cli.date={{.Date}}'

archives:
  - format: tar.gz
    # this name template makes the result package named like tsdns_0.1.0_linux_amd64.tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - examples/*

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: honeybbq
    name: tsdns
  draft: false
  prerelease: auto
